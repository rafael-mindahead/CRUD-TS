<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar</title>
</head>
<body>
    <section>
        <div>
            <form>

                <label>nome</label>
                <input type="text" id="name" placeholder="digite o seu nome" required>

                <label>email</label>
                <input type="email" id= "email" placeholder="digite o seu email" required>

                <label>telefone</label>
                <input type="text" id="number" placeholder="digite o seu numero" required>

                <label>cpf</label>
                <input type="text" id="cpf" placeholder="digite o seu cpf" required>

                <label>senha</label>
                <input type="password" id="password" placeholder="digite a sua senha" required>

                <label>confirmar senha</label>
                <input type="password" id="confirm_password" placeholder="confirme a sua senha" required>

                <button type="submit" id="buttonSubmit">Registrar</button>



            </form>
        </div>
    </section>
    <script src="Registro.js"></script>
</body>
</html>
